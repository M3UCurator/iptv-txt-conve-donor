name: Sync live.txt from upstream

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

concurrency:
  group: sync-live-txt
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out donor repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and detect live.txt changes
        id: upstream
        shell: bash
        run: |
          git remote add upstream https://github.com/807080747/iptv-txt-conve.git || true
          git fetch upstream main
          if git diff --quiet HEAD upstream/main -- live.txt; then
            echo "live_txt_changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream live.txt change detected."
          else
            echo "live_txt_changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream live.txt changed; preparing sync."
          fi

      - name: Restore live.txt from upstream cleanly
        if: steps.upstream.outputs.live_txt_changed == 'true'
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -fd
          git restore --source=upstream/main --staged --worktree live.txt

      - name: Set up Node.js
        if: steps.upstream.outputs.live_txt_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.upstream.outputs.live_txt_changed == 'true'
        run: npm install

      - name: Regenerate live.txt
        if: steps.upstream.outputs.live_txt_changed == 'true'
        run: node conve.js

      - name: Convert live.txt to live.m3u
        if: steps.upstream.outputs.live_txt_changed == 'true'
        run: node txt-to-m3u.js

      - name: Commit and push if changed
        if: steps.upstream.outputs.live_txt_changed == 'true'
        shell: bash
        run: |
          git add live.txt live.m3u
          if git diff --cached --quiet; then
            echo "No live.txt or live.m3u changes to commit"
            exit 0
          fi
          git commit -m "Sync live.txt and generate live.m3u"
          git push origin HEAD
